# ---------------------------------------------------------------------------
# Perfil "docker" -- ativado pela variavel SPRING_PROFILES_ACTIVE no compose.
#
# O application.properties e o arquivo base: vale sempre. Um arquivo
# application-<perfil>.properties e lido DEPOIS dele e sobrescreve so as chaves
# que repetir. Tudo que nao aparecer aqui continua vindo do arquivo base.
#
# O que muda aqui e o que faz sentido no ambiente de aprendizado mas nao numa
# execucao de verdade.
# ---------------------------------------------------------------------------

# O arquivo base imprime cada consulta que o Hibernate gera -- otimo para
# entender o que o JPA faz, insuportavel num servico que recebe trafego: um
# redirecionamento simples geraria varias linhas de log.
logging.level.com.joaoalcantara.encurtador=INFO
logging.level.org.hibernate.SQL=WARN
spring.jpa.properties.hibernate.format_sql=false

# O /actuator/health com detalhes revela o banco em uso, o espaco livre em
# disco e o estado do Redis. Isso e informacao util para quem administra o
# servico e para quem quer ataca-lo. Sem autenticacao configurada, o endpoint e
# publico -- entao detalhe nenhum.
#
# O health check do compose nao perde nada com isso: ele so olha o "status".
management.endpoint.health.show-details=never
