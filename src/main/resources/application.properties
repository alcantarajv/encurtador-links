# ---------------------------------------------------------------------------
# Identificação da aplicação
# ---------------------------------------------------------------------------
spring.application.name=encurtador-links

# Grupo de perfis: ativar "prod" ativa junto o "docker".
#
# O perfil "docker" ja baixa o nivel de log e esconde os detalhes do
# /actuator/health -- tudo isso vale igualmente em producao. Em vez de repetir
# essas linhas num application-prod.properties, o grupo faz o "prod" herdar o
# "docker" e acrescentar apenas o que e exclusivo de producao (as verificacoes
# de ProductionSafetyCheck). No deploy basta SPRING_PROFILES_ACTIVE=prod.
spring.profiles.group.prod=docker

# ---------------------------------------------------------------------------
# Servidor HTTP
# ---------------------------------------------------------------------------

# A porta vem do ambiente quando ele a define.
#
# Plataformas de hospedagem (Render, Railway, Fly.io) escolhem a porta e a
# injetam na variavel PORT -- a aplicacao precisa escutar nela, e nao numa porta
# fixa que ela decidiu sozinha. Ficar preso ao 8080 e a causa numero um de
# "deploy subiu mas nao responde": a plataforma encaminha o trafego para uma
# porta onde nao ha ninguem ouvindo.
#
# Localmente a variavel nao existe e vale o 8080 de sempre.
server.port=${PORT:8080}

# Não expõe a stack trace de erros na resposta HTTP.
# Stack trace em resposta de API vaza detalhes internos da aplicação.
server.error.include-stacktrace=never
server.error.include-message=always

# Desligamento gracioso. No padrao ("immediate") o servidor corta as conexoes
# assim que recebe o SIGTERM: quem estava no meio de uma requisicao leva erro de
# conexao. Com "graceful", o Tomcat para de aceitar conexoes novas e da tempo
# para as que ja estavam em andamento terminarem.
#
# Isso passa a valer de verdade a partir da Etapa 8: e o "docker stop" (e, na
# Etapa 10, a troca de versao no deploy) que dispara o sinal.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---------------------------------------------------------------------------
# Actuator (monitoramento)
# Por padrão o Actuator só expõe /health. Aqui liberamos também /info.
# Nunca exponha "*" em produção — isso abriria endpoints sensíveis.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Encurtador de Links
info.app.description=API REST de encurtamento de links

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.joaoalcantara.encurtador=DEBUG

# ---------------------------------------------------------------------------
# Encurtador
# Endereco publico usado para montar a URL curta devolvida na resposta.
# Atras de um proxy o host que chega na requisicao nao e o host publico,
# por isso isto e configuracao. Em producao vem de variavel de ambiente.
# ---------------------------------------------------------------------------
shortener.base-url=${SHORTENER_BASE_URL:http://localhost:8080}

# ---------------------------------------------------------------------------
# Banco de dados (PostgreSQL via docker-compose.yml)
# Suba o banco antes da aplicacao:  docker compose up -d
#
# Credenciais vem do ambiente; os defaults valem so para desenvolvimento local.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/encurtador}
spring.datasource.username=${DB_USERNAME:encurtador}
spring.datasource.password=${DB_PASSWORD:encurtador}

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# validate, nunca update ou create-drop: quem cria e altera tabela e o Flyway.
# Com "validate" o Hibernate apenas confere se a tabela bate com a entidade e
# derruba a aplicacao na subida se discordarem -- o erro aparece no deploy, e
# nao horas depois numa consulta em producao.
spring.jpa.hibernate.ddl-auto=validate

# Fecha a sessao do Hibernate ao sair do servico, em vez de manter aberta ate a
# resposta HTTP terminar. O padrao (true) segura conexao do pool a toa e esconde
# consultas disparadas na serializacao do JSON.
spring.jpa.open-in-view=false

# Grava e le datas em UTC, independentemente do fuso da maquina.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Quanto esperar por uma conexao livre do pool antes de desistir.
#
# O padrao do HikariCP e 30 segundos. Com o banco fora do ar, cada requisicao
# que precise dele segura uma thread do Tomcat por meio minuto -- em poucos
# segundos de trafego o servidor fica sem threads e para de responder ate o que
# nao depende do banco. Mesma logica ja aplicada ao Redis na Etapa 5: falhar
# rapido e melhor do que travar.
#
# Configuravel pelo ambiente porque bancos gerenciados de plano gratuito
# hibernam quando ficam ociosos (o Neon suspende depois de 5 minutos). A
# primeira conexao depois disso espera o banco acordar, o que passa folgado dos
# 3 segundos -- nesse cenario o valor precisa subir para uns 10000.
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:3000}

# Tamanho maximo do pool de conexoes.
#
# O padrao do HikariCP e 10, que e razoavel localmente. Bancos de plano gratuito
# costumam limitar o total de conexoes simultaneas a algo entre 5 e 20 -- e esse
# teto vale para o servidor inteiro, nao por aplicacao. Estourar o limite faz o
# banco recusar conexao, e o erro que aparece ("too many clients") nao aponta
# para o pool. Por isso o valor e configuravel pelo ambiente.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# ---------------------------------------------------------------------------
# Flyway (migrations)
# Le os arquivos de src/main/resources/db/migration na subida da aplicacao e
# aplica os que ainda nao foram executados, registrando cada um na tabela
# flyway_schema_history.
# ---------------------------------------------------------------------------
spring.flyway.enabled=true

# ---------------------------------------------------------------------------
# SQL no log -- util para aprender o que o Hibernate gera.
# Comente estas duas linhas quando o log ficar ruidoso demais.
# ---------------------------------------------------------------------------
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Redis (cache do redirecionamento)
# Sobe junto com o banco:  docker compose up -d
# ---------------------------------------------------------------------------
# Endereco do Redis, com dois niveis de default.
#
# Servicos gerenciados (o Key Value do Render, o Upstash, o Redis do Railway)
# nao entregam host e porta separados: entregam uma URL unica, que costuma
# carregar senha e as vezes TLS -- "rediss://:senha@host:6379". Nao ha onde
# encaixar isso em host/port.
#
# Entao: se REDIS_URL existir, ela manda. Se nao existir, a URL e montada a
# partir de REDIS_HOST e REDIS_PORT (o caso do docker-compose), e sem nenhuma
# das duas sobra o localhost de sempre.
spring.data.redis.url=${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}

# Tempo maximo esperando o Redis. O padrao e infinito: se o Redis travar, a
# requisicao de redirecionamento trava junto. Melhor falhar rapido.
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# Escolhe o Redis como implementacao do cache. Sem esta linha o Spring usaria um
# ConcurrentHashMap local -- que funciona, mas nao e compartilhado entre
# instancias da aplicacao.
spring.cache.type=redis

# ---------------------------------------------------------------------------
# Rate limiting por IP
#
# Criar link e caro (grava no banco, consome espaco de codigos) e ninguem cria
# dez links por minuto na mao. Redirecionar e o uso normal do servico: quem
# navega pode abrir varios links seguidos, entao o teto ali e bem mais alto.
# ---------------------------------------------------------------------------
shortener.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
shortener.rate-limit.creation.limit=${RATE_LIMIT_CREATION:10}
shortener.rate-limit.creation.window=1m
shortener.rate-limit.redirect.limit=${RATE_LIMIT_REDIRECT:120}
shortener.rate-limit.redirect.window=1m

# ---------------------------------------------------------------------------
# Cabecalhos de proxy
#
# Atras de um balanceador (o caso do deploy da Etapa 10), getRemoteAddr()
# devolveria o IP do proxy e todos os visitantes cairiam no mesmo contador de
# rate limit. Com "framework", o Spring processa X-Forwarded-For e afins num
# filtro proprio antes da requisicao chegar na aplicacao.
#
# So use isto quando a aplicacao estiver de fato atras de um proxy: exposta
# direto na internet, o cabecalho passa a ser forjavel pelo cliente.
# ---------------------------------------------------------------------------
server.forward-headers-strategy=framework
shortener.rate-limit.stats.limit=${RATE_LIMIT_STATS:30}
shortener.rate-limit.stats.window=1m

# ---------------------------------------------------------------------------
# Registro de cliques
#
# O IP nunca e gravado: o que vai para o banco e o SHA-256 do IP com este sal.
# Trocar o sal reinicia a contagem de visitantes distintos, porque os hashes
# antigos deixam de casar com os novos.
# ---------------------------------------------------------------------------
shortener.click-tracking.enabled=${CLICK_TRACKING_ENABLED:true}
shortener.click-tracking.ip-salt=${CLICK_IP_SALT:sal-de-desenvolvimento-trocar-em-producao}
shortener.click-tracking.top-referrers-limit=5
shortener.click-tracking.history-days=7
