# ---------------------------------------------------------------------------
# Identificação da aplicação
# ---------------------------------------------------------------------------
spring.application.name=encurtador-links

# ---------------------------------------------------------------------------
# Servidor HTTP
# ---------------------------------------------------------------------------
server.port=8080

# Não expõe a stack trace de erros na resposta HTTP.
# Stack trace em resposta de API vaza detalhes internos da aplicação.
server.error.include-stacktrace=never
server.error.include-message=always

# ---------------------------------------------------------------------------
# Actuator (monitoramento)
# Por padrão o Actuator só expõe /health. Aqui liberamos também /info.
# Nunca exponha "*" em produção — isso abriria endpoints sensíveis.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Encurtador de Links
info.app.description=API REST de encurtamento de links

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.joaoalcantara.encurtador=DEBUG
