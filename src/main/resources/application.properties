# ---------------------------------------------------------------------------
# Identificação da aplicação
# ---------------------------------------------------------------------------
spring.application.name=encurtador-links

# ---------------------------------------------------------------------------
# Servidor HTTP
# ---------------------------------------------------------------------------
server.port=8080

# Não expõe a stack trace de erros na resposta HTTP.
# Stack trace em resposta de API vaza detalhes internos da aplicação.
server.error.include-stacktrace=never
server.error.include-message=always

# ---------------------------------------------------------------------------
# Actuator (monitoramento)
# Por padrão o Actuator só expõe /health. Aqui liberamos também /info.
# Nunca exponha "*" em produção — isso abriria endpoints sensíveis.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Encurtador de Links
info.app.description=API REST de encurtamento de links

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.joaoalcantara.encurtador=DEBUG

# ---------------------------------------------------------------------------
# Encurtador
# Endereco publico usado para montar a URL curta devolvida na resposta.
# Atras de um proxy o host que chega na requisicao nao e o host publico,
# por isso isto e configuracao. Em producao vem de variavel de ambiente.
# ---------------------------------------------------------------------------
shortener.base-url=${SHORTENER_BASE_URL:http://localhost:8080}

# ---------------------------------------------------------------------------
# Banco de dados (PostgreSQL via docker-compose.yml)
# Suba o banco antes da aplicacao:  docker compose up -d
#
# Credenciais vem do ambiente; os defaults valem so para desenvolvimento local.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/encurtador}
spring.datasource.username=${DB_USERNAME:encurtador}
spring.datasource.password=${DB_PASSWORD:encurtador}

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# validate, nunca update ou create-drop: quem cria e altera tabela e o Flyway.
# Com "validate" o Hibernate apenas confere se a tabela bate com a entidade e
# derruba a aplicacao na subida se discordarem -- o erro aparece no deploy, e
# nao horas depois numa consulta em producao.
spring.jpa.hibernate.ddl-auto=validate

# Fecha a sessao do Hibernate ao sair do servico, em vez de manter aberta ate a
# resposta HTTP terminar. O padrao (true) segura conexao do pool a toa e esconde
# consultas disparadas na serializacao do JSON.
spring.jpa.open-in-view=false

# Grava e le datas em UTC, independentemente do fuso da maquina.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# Flyway (migrations)
# Le os arquivos de src/main/resources/db/migration na subida da aplicacao e
# aplica os que ainda nao foram executados, registrando cada um na tabela
# flyway_schema_history.
# ---------------------------------------------------------------------------
spring.flyway.enabled=true

# ---------------------------------------------------------------------------
# SQL no log -- util para aprender o que o Hibernate gera.
# Comente estas duas linhas quando o log ficar ruidoso demais.
# ---------------------------------------------------------------------------
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Redis (cache do redirecionamento)
# Sobe junto com o banco:  docker compose up -d
# ---------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Tempo maximo esperando o Redis. O padrao e infinito: se o Redis travar, a
# requisicao de redirecionamento trava junto. Melhor falhar rapido.
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# Escolhe o Redis como implementacao do cache. Sem esta linha o Spring usaria um
# ConcurrentHashMap local -- que funciona, mas nao e compartilhado entre
# instancias da aplicacao.
spring.cache.type=redis

# ---------------------------------------------------------------------------
# Rate limiting por IP
#
# Criar link e caro (grava no banco, consome espaco de codigos) e ninguem cria
# dez links por minuto na mao. Redirecionar e o uso normal do servico: quem
# navega pode abrir varios links seguidos, entao o teto ali e bem mais alto.
# ---------------------------------------------------------------------------
shortener.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
shortener.rate-limit.creation.limit=${RATE_LIMIT_CREATION:10}
shortener.rate-limit.creation.window=1m
shortener.rate-limit.redirect.limit=${RATE_LIMIT_REDIRECT:120}
shortener.rate-limit.redirect.window=1m

# ---------------------------------------------------------------------------
# Cabecalhos de proxy
#
# Atras de um balanceador (o caso do deploy da Etapa 10), getRemoteAddr()
# devolveria o IP do proxy e todos os visitantes cairiam no mesmo contador de
# rate limit. Com "framework", o Spring processa X-Forwarded-For e afins num
# filtro proprio antes da requisicao chegar na aplicacao.
#
# So use isto quando a aplicacao estiver de fato atras de um proxy: exposta
# direto na internet, o cabecalho passa a ser forjavel pelo cliente.
# ---------------------------------------------------------------------------
server.forward-headers-strategy=framework
